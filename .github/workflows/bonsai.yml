name: Bonsai

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - bonsai/**
      - .github/workflows/bonsai.yml

permissions:
  contents: write

concurrency: bonsai

jobs:
  bonsai:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r bonsai/requirements.txt

      - name: Test accès ft-minecraft
        env:
          GH_TOKEN: ${{ secrets.BONSAI_PAT }}
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/tristan-reig/ft-minecraft
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/tristan-reig/ft-minecraft/commits?since=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=100" \
            | grep '"email"' | sort | uniq -c

      - name: Draw the bonsai
        env:
          # Si secret BONSAI_PAT présent alors repos privés inclus
          # sinon activité publique seulement.
          GH_TOKEN: ${{ secrets.BONSAI_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "token: ${GH_TOKEN:0:4}"
          python bonsai/generate.py --user "${{ github.repository_owner }}" --out assets/bonsai.gif

      - name: Commit the bonsai if it changed
        shell: bash
        run: |
          git add assets/bonsai.gif
          if git diff --cached --quiet; then
            echo "The bonsai is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "bonsai: daily update"
          git push --quiet
